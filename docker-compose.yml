services:
  firewall:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DOMESTIQUE_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DOMESTIQUE_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DOMESTIQUE_AZURE_API_KEY=${AZURE_API_KEY:-}
      - DOMESTIQUE_AZURE_API_BASE=${AZURE_API_BASE:-}
      - DOMESTIQUE_FAIL_MODE=closed
      # Block-first policy, matching the fail-closed posture above. Resolves against
      # the image's WORKDIR (/app, Dockerfile:3), which is where `COPY domestique/`
      # (Dockerfile:16) puts the packaged YAML. The other shipped option is
      # domestique/policy/cli-rules.yaml, which redacts in place instead of blocking.
      #
      # This previously pointed at domestique/policy/rules.yaml, which does not exist.
      # A missing file is not fatal — PolicyEngine.from_yaml falls back to five
      # built-in rules — but it logs policy_file_missing on every boot and means
      # edits to the shipped YAML have no effect. Confirm the startup log says
      # policy_loaded with a non-zero rule_count.
      - DOMESTIQUE_POLICY_PATH=domestique/policy/browser-rules.yaml
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # TLS termination - presents CA certs to intercepted domains.
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - firewall
    restart: unless-stopped
